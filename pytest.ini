[pytest]
# Collect only the harness's own tests.
#
# Task verdicts under tasks/ and tasks-retired/ are NOT unit tests. Each is graded against
# a per-rep workspace copy that the harness makes in a temp dir outside this tree, and ten
# of them share the basename test_compliance.py with no package markers -- so a bare
# `pytest -q` at the repo root used to die with 10 collection errors before running
# anything. That made the harness's own tests unrunnable by the obvious command, which is
# how the confound detector ended up with no test at all.
#
# Workspaces live under $TMPDIR, so this file never applies to a verdict run.
testpaths = tests
